# The Logfare catalog, refreshed against the upstream's own status API:
#
#     https://logfare.ai/v1/status?hours=24
#
# Only models that advertise `chat/completions` are registered here; the
# image/TTS/STT models the catalog also lists (flux-*, sdxl-lightning,
# whisper-large-v3-turbo, aura-2-en, nova-3, phoenix-1.0, lucid-origin) do not
# support chat and are deliberately omitted.
#
# Every chat model Logfare serves is registered below, plus a `*` wildcard so a
# model Logfare adds later works without editing this file. The named entries
# win over the wildcard (LiteLLM resolves an exact model_name first), which is
# what lets the aliases at the bottom pin a haiku name to a live model.
#
# Logfare retires models without notice. Re-read the live catalog before
# assuming a name here still exists; the wildcard is a fallback, not a
# substitute for naming a model you rely on.
general_settings:
  # Required since litellm 1.104: without a master key the proxy refuses to
  # start, because it would otherwise accept every request with no
  # authentication. This proxy is a local translation shim in front of Logfare,
  # not a multi-tenant gateway, so the profile's own upstream token doubles as
  # the proxy credential — zim-claude already sends it as x-api-key, so the
  # request that worked before keeps working, while anything else on the box
  # that finds the port is now rejected.
  master_key: os.environ/ANTHROPIC_AUTH_TOKEN

model_list:
  # --- DeepSeek ---------------------------------------------------------------
  # deepseek-v4.1-flash is the shipped default (ANTHROPIC_MODEL) and the only
  # model with a solid uptime record, so it leads.
  - model_name: deepseek-v4.1-flash
    litellm_params:
      model: openai/deepseek-v4.1-flash
      api_base: https://logfare.ai/v1
      api_key: os.environ/ANTHROPIC_AUTH_TOKEN

  # --- Qwen / Gemma -----------------------------------------------------------
  - model_name: qwen-3.8-27b
    litellm_params:
      model: openai/qwen-3.8-27b
      api_base: https://logfare.ai/v1
      api_key: os.environ/ANTHROPIC_AUTH_TOKEN

  # gemma-4-26b is the weakest of the four upstream — Logfare reports it
  # "degraded" — but it is genuinely served, so it stays selectable rather than
  # being hidden.
  - model_name: gemma-4-26b
    litellm_params:
      model: openai/gemma-4-26b
      api_base: https://logfare.ai/v1
      api_key: os.environ/ANTHROPIC_AUTH_TOKEN

  # --- Router -----------------------------------------------------------------
  # Logfare's own model picker: routes to whichever of the above is healthiest.
  - model_name: logfare/auto
    litellm_params:
      model: openai/logfare/auto
      api_base: https://logfare.ai/v1
      api_key: os.environ/ANTHROPIC_AUTH_TOKEN

  # --- The rest of Logfare's chat catalog -------------------------------------
  # Live as of 2026-10-19, from /v1/status filtered on chat/completions. The
  # wildcard below would route these anyway; they are named so the proxy's own
  # /v1/models lists them, and so a model that is *removed* upstream is still a
  # deliberate edit here rather than silently disappearing.
  #
  # Premium entries require a one-time training opt-in on the account; until
  # that is granted the upstream answers 403 training_optin_required. That is
  # the account's state, not a fault in this file.
  - model_name: deepseek-v4-pro-0813
    litellm_params:
      model: openai/deepseek-v4-pro-0813
      api_base: https://logfare.ai/v1
      api_key: os.environ/ANTHROPIC_AUTH_TOKEN

  - model_name: glm-5.3
    litellm_params:
      model: openai/glm-5.3
      api_base: https://logfare.ai/v1
      api_key: os.environ/ANTHROPIC_AUTH_TOKEN

  - model_name: glm-5.3-flash
    litellm_params:
      model: openai/glm-5.3-flash
      api_base: https://logfare.ai/v1
      api_key: os.environ/ANTHROPIC_AUTH_TOKEN

  - model_name: kimi-k2.6
    litellm_params:
      model: openai/kimi-k2.6
      api_base: https://logfare.ai/v1
      api_key: os.environ/ANTHROPIC_AUTH_TOKEN

  - model_name: claude-haiku-5-5
    litellm_params:
      model: openai/claude-haiku-5-5
      api_base: https://logfare.ai/v1
      api_key: os.environ/ANTHROPIC_AUTH_TOKEN

  - model_name: minimax-m3.1-flash
    litellm_params:
      model: openai/minimax-m3.1-flash
      api_base: https://logfare.ai/v1
      api_key: os.environ/ANTHROPIC_AUTH_TOKEN

  # --- Wildcard ---------------------------------------------------------------
  # Any chat model Logfare adds later, without waiting for a zim-claude release.
  # `openai/*` forwards the requested name upstream verbatim, which is exactly
  # what this proxy is for. It is a fallback, never a preferred route: the
  # named entries above match first, and a name Logfare does not serve simply
  # 404s upstream instead of being rejected here.
  - model_name: "*"
    litellm_params:
      model: openai/*
      api_base: https://logfare.ai/v1
      api_key: os.environ/ANTHROPIC_AUTH_TOKEN

  # Claude Code probes/streams with a "small fast" model too; map the usual
  # haiku names onto a live upstream model so background requests don't 404.
  # These are aliases, not catalog entries — they exist so a client that hard-
  # codes a haiku name still works.
  - model_name: claude-3-5-haiku-latest
    litellm_params:
      model: openai/deepseek-v4.1-flash
      api_base: https://logfare.ai/v1
      api_key: os.environ/ANTHROPIC_AUTH_TOKEN

  - model_name: claude-3-5-haiku
    litellm_params:
      model: openai/deepseek-v4.1-flash
      api_base: https://logfare.ai/v1
      api_key: os.environ/ANTHROPIC_AUTH_TOKEN

  - model_name: claude-haiku-4-5-20251001
    litellm_params:
      model: openai/deepseek-v4.1-flash
      api_base: https://logfare.ai/v1
      api_key: os.environ/ANTHROPIC_AUTH_TOKEN

  - model_name: gemini
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GEMINI_API_KEY

  # The free tier: 50 requests/day (resets 06:00 UTC). It is addressed as
  # "openai/openrouter/free" with the endpoint spelled out rather than as
  # "openrouter/openrouter/free" — both send "openrouter/free" to the API, but
  # the router's cost-map lookup keys off the prefix, and under the openrouter/
  # prefix it looks up a key ("openrouter/free") the cost map does not have.
  # The 1M limit is declared here so the router's pre-call check does not
  # filter this route out of exactly the long prompts it exists to serve.
  - model_name: openrouter
    litellm_params:
      model: openai/openrouter/free
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY
      drop_params: true
    model_info:
      max_input_tokens: 1048576
      max_output_tokens: 32768

router_settings:
  # Logfare meters a request budget per account, not per model, and answers a
  # spent budget with 429 "Your account has reached its request budget" — which
  # Claude Code surfaces as a rate-limit error on whatever model it asked for.
  # Without a fallback that turns every session into a dead end until the
  # budget resets (the 429 carries retry-after in the hours).
  #
  # gemma-4-26b is the one model that has kept answering through a spent
  # budget, and it calls tools correctly, so it is the stand-in for every
  # model: default_fallbacks covers the named entries, the `*` wildcard and the
  # haiku aliases in one line. A model that has budget of its own is still used
  # first; this only runs when it does not.
  #
  # num_retries: 0 matters. A retry against a model whose budget is spent just
  # burns the same 429 again before the fallback is reached.
  num_retries: 0
  default_fallbacks: ["gemma-4-26b", "gemini", "openrouter"]
