# zim-claude · Claude Desktop integration — LiteLLM proxy config
#
#   Claude Desktop (Cowork / Chat / Code)
#        |  POST /v1/messages   Authorization: Bearer <master key>
#        v
#   LiteLLM :4002   (this config, started by start-desktop-proxy.sh)
#        |  provider-native SDKs
#        v
#   Gemini · Mistral · OpenRouter
#
# Claude Desktop imposes two hard requirements on the gateway:
#
#   1. Every model_name MUST look like an Anthropic/Claude model
#      (contain "claude" or "anthropic"). Anything else is dropped
#      from the picker with:
#        inferenceModels: "X" is not an Anthropic model and was removed...
#      That is why the upstream models are exposed under claude-* names below.
#
#   2. drop_params: true — Cowork/Code sessions send Anthropic-only
#      fields (cache_control, tool_reference, experimental beta
#      headers) that a non-Anthropic upstream rejects with HTTP 400.
#
# The api_key is read from the environment; start-desktop-proxy.sh sources
# the profile (default ~/claude-source/deepseek-claude) so the upstream
# keys are present in the proxy's environment.
#
# ---------------------------------------------------------------------------
# Upstream status (verified against the live providers)
# ---------------------------------------------------------------------------
#   Gemini     OK    gemini-3.5-flash / gemini-3.7-flash. The *context window*
#                    is 1M, but the free tier's real ceiling is the metric
#                    "generate_content_free_tier_input_token_count, limit:
#                    250000" — a single request above ~250k input tokens is
#                    rejected with 429. The daily request allowance is 20
#                    ("generate_content_free_tier_requests, limit: 20").
#                    Explicit context caching (createCachedContent) is
#                    rejected too (TotalCachedContentStorageTokensPerModel
#                    FreeTier limit=0), so that transform is disabled below.
#   Mistral    OK    codestral-latest, 256k context, no daily quota (other
#                    Mistral tiers 429 on this key)
#   OpenRouter OK    openrouter/free — 50 req/day, resets 06:00 UTC, and some
#                         free backends emit malformed tool_calls. The only
#                         route here that accepts more than ~250k tokens.
#   Logfare    DEAD  401 "rejoin the Logfare server at /migrate" — the
#                         ANTHROPIC_AUTH_TOKEN in ~/claude-source/deepseek-claude
#                         is no longer accepted. The previous deepseek-v4.1-flash
#                         routes below are kept, commented out, so they can be
#                         restored the moment that key works again.
#
# Why these four entries survive a session whose prompt overflows Mistral's
# 256k context window:
#   * The primary "Opus 5.5" routes to Mistral (strongest upstream, 256k).
#   * enable_pre_call_checks + context_window_fallbacks route an oversized
#     request away from Mistral before its own 400/3059 fires, and on to the
#     remaining upstreams instead of dead-ending.
#   * The Gemini rows cover the 250k band that Mistral cannot; above ~250k
#     only OpenRouter can answer, and it is the last resort in every chain.

model_list:
  # --- "Opus 5.5" -----------------------------------------------------------
  # Mistral Codestral: the strongest reliable upstream on the current keys.
  # 256k context, native tool calling, no daily quota. The deployment-level
  # model_info is the right place for the limit (it is silently ignored when
  # nested under litellm_params); claiming the full 256k lets the router's
  # pre-call check accept prompts up to the real Mistral cap and hand off
  # anything above it to the Gemini 1M row below.
  - model_name: claude-opus-5-5
    litellm_params:
      model: mistral/codestral-latest
      api_key: os.environ/MISTRAL_API_KEY
      drop_params: true
    model_info:
      max_input_tokens: 256000
      max_output_tokens: 32000

  # --- "Opus 5.5" with the 1M-context row ----------------------------------
  # The Desktop app sends this id verbatim (it appends "[1m]" itself), so it
  # needs its own entry or every request lands on "No deployments available".
  # Gemini 3.7 Flash advertises a 1,048,576-token input limit, which is what
  # makes the 1M row honest rather than a duplicate of the 256k route.
  - model_name: "claude-opus-5-5[1m]"
    litellm_params:
      model: gemini/gemini-3.7-flash
      api_key: os.environ/GEMINI_API_KEY
      drop_params: true
    model_info:
      max_input_tokens: 1048576
      max_output_tokens: 65536

  # --- "Gemini 3.5 Flash" ----------------------------------------------------
  # The name must survive Claude Desktop's Anthropic-model filter, which
  # rejects any id containing a known non-Anthropic fragment (gemini, gemma,
  # gpt, openai, ...). "claude-gemini" is dropped with
  #   inferenceModels: "claude-gemini" is not an Anthropic model ...
  # so the route is named "claude-gem" and the upstream stays Gemini. The
  # picker shows the labelOverride from the Desktop config instead.
  - model_name: claude-gem
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GEMINI_API_KEY
      drop_params: true
    model_info:
      max_input_tokens: 1048576
      max_output_tokens: 65536

  # --- "OpenRouter Free" ----------------------------------------------------
  # Free tier: 50 requests/day (resets 06:00 UTC). Some free backends emit
  # tool_calls with an empty function.name, which Claude Code rejects with
  # HTTP 400 — so this route is the last fallback, never a primary.
  #
  # It is, however, the ONLY route that can take a prompt above Gemini's
  # 250k free-tier ceiling, so its limit is declared as 1M: with the cost
  # map's 200k the router's pre-call check would filter this deployment out
  # of exactly the requests it exists to serve.
  #
  # The route is addressed as "openai/openrouter/free" with OpenRouter's
  # endpoint spelled out, NOT as "openrouter/openrouter/free". Both send the
  # same "openrouter/free" to the API, but the router's cost-map lookup keys
  # off the prefix: for the openrouter/ prefix it looks up "openrouter/free",
  # a key the cost map does not have (it has "openrouter/openrouter/free"),
  # so every request logged "This model isn't mapped yet" and the pre-call
  # context check was skipped for this deployment. Under the openai/ prefix
  # the lookup key becomes "openai/openrouter/free", which the router
  # registers from this deployment's own model_info at startup.
  - model_name: claude-openrouter
    litellm_params:
      model: openai/openrouter/free
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY
      drop_params: true
    model_info:
      max_input_tokens: 1048576
      max_output_tokens: 32768

  # --- Logfare / DeepSeek-V4.1-Flash (disabled: key returns 401) -----------
  # Restore these two entries and point claude-opus-5-5 / claude-opus-5-5[1m]
  # back at them once ~/claude-source/deepseek-claude holds a working
  # ANTHROPIC_AUTH_TOKEN.
  #
  # - model_name: claude-opus-5-5
  #   litellm_params:
  #     model: openai/deepseek-v4.1-flash
  #     api_base: https://logfare.ai/v1
  #     api_key: os.environ/ANTHROPIC_AUTH_TOKEN
  #     drop_params: true
  #
  # - model_name: "claude-opus-5-5[1m]"
  #   litellm_params:
  #     model: openai/deepseek-v4.1-flash
  #     api_base: https://logfare.ai/v1
  #     api_key: os.environ/ANTHROPIC_AUTH_TOKEN
  #     drop_params: true

litellm_settings:
  # Belt-and-braces: strip unsupported params globally too.
  drop_params: true
  # Token counting for the Gemini routes goes through google-genai, which is
  # installed in this venv; without it POST /v1/messages/count_tokens 500s.
  set_verbose: False
  # Google's free-tier Gemini allows ZERO explicit cached content storage
  # (TotalCachedContentStorageTokensPerModelFreeTier limit=0). Any Claude
  # session sends a cache_control ephemeral block on the system prefix, so
  # disabling the transform here makes claude-gem serve instead of 429ing.
  # This only affects the Gemini -> cachedContents path; prompts still work
  # without explicitly cached contents, and implicit Gemini prompt caching
  # (which does not charge the explicit storage quota) is unaffected.
  disable_anthropic_gemini_context_caching_transform: True

router_settings:
  # enable_pre_call_checks: true activates the router's local input-token pre-
  # call check: deployments whose declared max_input_tokens is exceeded are
  # filtered out before the request reaches the provider, so an oversized
  # prompt never hits Mistral's raw 400/3059. Without this, the only thing
  # stopping the request from reaching the 400 is the configured limit inside
  # litellm_params (silently ignored by the router's lookups).
  enable_pre_call_checks: true
  # Default fallbacks: fail over to a healthy upstream rather than surfacing the
  # first error. claude-gem (Google) is tried first after claude-opus-5-5
  # fails; claude-openrouter is the weak last resort (free-tier quota +
  # malformed tool_calls). Cache control is stripped globally above, so the
  # only failure mode left for claude-gem is a genuine upstream problem.
  default_fallbacks: ["claude-gem", "claude-openrouter"]
  # A retry against an upstream that just told us "too many requests" burns the
  # same 429 again before the fallback is reached.
  num_retries: 0
  # Cooldown policy. A benched deployment takes the WHOLE chain down with it:
  # the fallback group then answers "No deployments available for selected
  # model ... All deployments ... in cooldown" and the client gets a hard 429
  # even though a healthy upstream exists. The free-tier upstreams here fail
  # with 429 for quota reasons that clear on their own schedule (Gemini's
  # per-minute token bucket, OpenRouter's daily allowance), so those must not
  # bench a deployment. allowed_fails_policy counts failures per exception
  # type per deployment (counter TTL = cooldown_time), so a transient 429 or
  # 400 never benches anything, while a genuinely broken upstream (5xx) is
  # benched after a handful of failures.
  allowed_fails_policy:
    RateLimitErrorAllowedFails: 20
    BadRequestErrorAllowedFails: 20
    AuthenticationErrorAllowedFails: 20
    TimeoutErrorAllowedFails: 5
    InternalServerErrorAllowedFails: 5
    ServiceUnavailableErrorAllowedFails: 5
    BadGatewayErrorAllowedFails: 5
    NotFoundErrorAllowedFails: 5
    ContentPolicyViolationErrorAllowedFails: 5
  cooldown_time: 30
  # On a context-window overflow of claude-opus-5-5, fail over instead of
  # failing. Order matters: claude-openrouter comes first because it is the
  # only upstream that accepts a prompt above Gemini's 250k free-tier
  # ceiling, and OpenRouter's own 50/day allowance is far bigger than
  # Gemini's 20/day — asking Gemini first would burn a scarce daily request
  # on a prompt it can never answer. The Gemini rows stay in the chain as
  # the fallback for prompts they can serve.
  context_window_fallbacks:
    - claude-opus-5-5: ["claude-openrouter", "claude-opus-5-5[1m]", "claude-gem"]

general_settings:
  # Value Claude Desktop sends as "Gateway API key".
  # Set by start-desktop-proxy.sh (default: sk-claude-desktop-local).
  master_key: os.environ/CLAUDE_DESKTOP_LITELLM_KEY
